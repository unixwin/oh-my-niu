schema = "winuxsh:plugin-index@0.1.0"
bundle = "oh-my-winuxsh"
version = "1.0.1"
bundle_api = "winuxsh:plugin-bundle@0.1.0"
min_winuxsh = "0.10.0"

[release]
artifact = "oh-my-winuxsh-1.0.1.zip"
checksum = "oh-my-winuxsh-1.0.1.zip.sha256"
checksum_algorithm = "sha256"
checksum_required = true
signature = "unsupported"

[[packs]]
name = "git"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "source"
category = "devtools"
summary = "Git aliases, completions, and prompt segments."
default = true
permissions = ["shell:source", "cwd:read", "process:run:git"]
required_binaries = ["git"]

[[packs]]
name = "winuxcmd-core"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "builtin"
category = "devtools"
summary = "Static completions for WinuxCmd core command links."
default = true
permissions = []
required_binaries = []

[[packs]]
name = "docker"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "source"
category = "devtools"
summary = "Docker aliases and completion hints."
default = false
permissions = ["shell:source", "cwd:read", "process:run:docker"]
required_binaries = ["docker"]

[[packs]]
name = "kubectl"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "source"
category = "devtools"
summary = "Kubectl aliases and completion hints."
default = false
permissions = ["shell:source", "cwd:read", "process:run:kubectl"]
required_binaries = ["kubectl"]

[[packs]]
name = "npm"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "source"
category = "devtools"
summary = "npm aliases and runtime completion shape detection."
default = false
permissions = ["shell:source", "cwd:read", "process:run:npm"]
required_binaries = ["npm"]

[[packs]]
name = "zoxide"
version = "1.0.1"
api = "winuxsh:plugin@0.1.0"
kind = "source"
category = "workflow"
summary = "z command shim plus directory tracking."
default = false
permissions = ["shell:source", "cwd:read", "shell:cwd:write", "process:run:zoxide"]
required_binaries = ["zoxide"]

[[packs]]
name = "direnv"
version = "1.0.1"
