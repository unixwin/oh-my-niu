name = "env-sync"
bundle = "oh-my-niu"
version = "2.0.0"
kind = "source"
api = "niubash:plugin@0.1.0"
category = "workflow"
summary = "Push/pull the WPM package manifest and shell config via any rclone remote."
default = false
permissions = ["shell:source", "process:run:rclone", "process:run:wpm"]
required_binaries = ["rclone", "wpm"]

[exports]
aliases = false
completions = []
prompt_segments = []
hooks = []
commands = []
keybindings = []
themes = []

[source]
entry = "packs/env-sync/init.winux"
