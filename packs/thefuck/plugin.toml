name = "thefuck"
bundle = "oh-my-niu"
version = "2.0.0"
kind = "source"
api = "niubash:plugin@0.1.0"
category = "workflow"
summary = "Correction shim for the previous interactive command."
default = false
permissions = ["shell:source", "history:read", "shell:execute:suggested-command", "process:run:thefuck"]
required_binaries = ["thefuck"]

[exports]
aliases = false
completions = []
prompt_segments = []
hooks = ["startup"]
commands = ["fuck"]
keybindings = []
themes = []

[source]
entry = "packs/thefuck/init.winux"
