name = "docker"
bundle = "oh-my-niu"
version = "1.0.1"
kind = "source"
api = "niubash:plugin@0.1.0"
category = "devtools"
summary = "Docker aliases and completion hints."
default = false
permissions = ["shell:source", "cwd:read", "process:run:docker"]
required_binaries = ["docker"]

[exports]
aliases = true
completions = ["docker"]
prompt_segments = []
hooks = []
commands = []
keybindings = []
themes = []

[source]
entry = "packs/docker/init.winux"
