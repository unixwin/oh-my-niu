name = "dotenv"
bundle = "oh-my-niu"
version = "1.0.1"
kind = "source"
api = "niubash:plugin@0.1.0"
category = "environment"
summary = "Safe .env loader on Niubash lifecycle hooks."
default = false
permissions = ["shell:source", "cwd:read", "fs:read:.env", "env:write"]
required_binaries = []

[exports]
aliases = false
completions = []
prompt_segments = []
hooks = ["startup", "precmd", "chpwd"]
commands = []
keybindings = []
themes = []

[source]
entry = "packs/dotenv/init.winux"
