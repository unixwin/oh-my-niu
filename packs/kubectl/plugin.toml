name = "kubectl"
bundle = "oh-my-niu"
version = "2.0.0"
kind = "source"
api = "niubash:plugin@0.1.0"
category = "devtools"
summary = "Kubectl aliases and completion hints."
default = false
permissions = ["shell:source", "cwd:read", "process:run:kubectl"]
required_binaries = ["kubectl"]

[exports]
aliases = true
completions = ["kubectl"]
prompt_segments = []
hooks = []
commands = []
keybindings = []
themes = []

[source]
entry = "packs/kubectl/init.winux"
