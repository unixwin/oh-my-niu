name = "oh-my-winuxsh"
version = "1.0.1"
publisher = "unixwin"
api = "winuxsh:plugin-bundle@0.1.0"
min_winuxsh = "0.10.0"
channel = "stable"
summary = "Official bundled plugin distribution for Winuxsh."

[update]
source = "github-release"
repo = "unixwin/oh-my-winuxsh"
asset = "oh-my-winuxsh-{version}.zip"

[packs]
default = ["git", "winuxcmd-core", "prompts", "keybindings", "themes"]
available = [
  "git",
  "winuxcmd-core",
  "docker",
  "kubectl",
  "npm",
  "zoxide",
  "direnv",
  "dotenv",
  "fzf",
  "command-not-found",
  "last-working-dir",
  "thefuck",
  "keybindings",
  "prompts",
  "starship",
  "themes",
  "env-sync",
]

[layout]
packs_dir = "packs"
aliases_dir = "aliases"
completions_dir = "completions"
prompts_dir = "prompts"
keybindings_dir = "keybindings"
themes_dir = "themes"
