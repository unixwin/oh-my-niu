name = "oh-my-niu"
version = "2.0.0"
publisher = "unixwin"
api = "niubash:plugin-bundle@0.1.0"
min_niubash = "1.0.0"
channel = "stable"
summary = "Official bundled plugin distribution for Niubash."

[update]
source = "github-release"
repo = "unixwin/oh-my-niu"
asset = "oh-my-niu-{version}.zip"

[packs]
default = ["git", "winuxcmd-core", "prompts", "keybindings", "themes"]
available = [
  "git",
  "winuxcmd-core",
  "docker",
  "kubectl",
  "npm",
  "zoxide",
  "direnv",
  "dotenv",
  "fzf",
  "command-not-found",
  "last-working-dir",
  "thefuck",
  "keybindings",
  "prompts",
  "starship",
  "themes",
  "command-timer",
  "auto-env",
  "dirmarks",
  "git-fetch-reminder",
]

[layout]
packs_dir = "packs"
aliases_dir = "aliases"
completions_dir = "completions"
prompts_dir = "prompts"
keybindings_dir = "keybindings"
themes_dir = "themes"
