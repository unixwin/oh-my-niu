name = "direnv"
version = "1.0.1"
kind = "source"
entry = "direnv.plugin.winux"
summary = "direnv export bash adapter for the current shell."
permissions = ["shell:source", "cwd:read", "env:write", "process:run:direnv"]
required_binaries = ["direnv"]

[exports]
functions = ["__niubash_direnv_apply"]
hooks = ["startup", "precmd", "chpwd"]
